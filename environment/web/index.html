<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MamaSafe Rwanda · 3D Referral Simulation</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script type="importmap">
    { "imports": { "three": "/static/vendor/three.module.min.js", "three/addons/": "/static/vendor/" } }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="vignette"></div>

  <header id="title-bar" class="glass pill">
    <span class="logo">✚</span>
    <div class="brand-text">
      <h1>MamaSafe Rwanda</h1>
      <p>RL ambulance dispatch</p>
    </div>
    <span class="vsep"></span>
    <div id="clock-box">
      <div id="clock">Day 1 00:00</div>
      <div id="conditions">—</div>
    </div>
  </header>

  <div id="hud-chips" class="glass pill">
    <div class="chip"><span class="k">Agent</span><span id="chip-agent">—</span></div>
    <div class="chip"><span class="k">Decision</span><span id="chip-step">0</span></div>
    <div class="chip"><span class="k">Delivered</span><span id="chip-done">0/50</span></div>
    <div class="chip"><span class="k">On time</span><span id="chip-ontime">—</span></div>
  </div>

  <div id="action-hud" class="hidden">
    <div class="k">Agent action</div>
    <div id="action-text"></div>
    <div id="action-sub"></div>
  </div>

  <section id="right-col">
    <div class="glass card-panel collapsible" id="decision-panel">
      <h2><span>🧠 AI decision</span></h2>
      <div class="body">
        <div id="agent-label" class="muted">—</div>
        <div id="decision"></div>
        <div id="manual-actions" class="hidden">
          <h3>Choose an action</h3>
          <div id="manual-buttons"></div>
        </div>
      </div>
    </div>
    <div class="glass card-panel collapsible" id="patients-panel">
      <h2><span>🤰 Patients</span><span id="patients-count" class="count"></span></h2>
      <div class="body">
        <div id="mission-list" class="list"></div>
        <div id="transit-list" class="list"></div>
      </div>
    </div>
  </section>

  <section id="dock" class="glass pill">
    <button id="play" class="round primary" title="Play / pause (Space)">⏸</button>
    <button id="step" class="round" title="Next decision">⏭</button>
    <button id="reset" class="round" title="Restart episode">↺</button>
    <input id="speed" type="range" min="0" max="100" value="26" title="Simulation speed" />
    <span id="speed-label"></span>
  </section>

  <button id="camera-pill" class="glass pill" title="C: switch between auto camera and map">🎬 <span id="camera-name">Auto camera</span></button>

  <div id="bottom-right">
    <div id="follow-card" class="glass hidden">
      <div class="speedo"><b id="follow-speed">0</b><span>km/h</span></div>
      <div class="follow-text">
        <div id="follow-title"></div>
        <div id="follow-phase"></div>
        <div id="follow-road" class="muted"></div>
      </div>
    </div>
    <div id="reward-card" class="glass">
      <div><div class="k">Step reward</div><div id="reward-step" class="big">+0.0</div></div>
      <div><div class="k">Total reward</div><div id="reward-total" class="big">0.0</div></div>
    </div>
  </div>

  <div id="banner" class="hidden"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
